# SwayFX-only settings. Plain sway rejects these commands, so this file is not
# included by default: on a machine running SwayFX add to the untracked
# ~/.config/sway/config.d/local.conf:
#   include ~/.config/sway/swayfx.conf

# Frosted glass behind waybar. Only waybar gets blur, not windows (alacritty
# is slightly transparent). waybar's style.css draws one semi-transparent
# full-width bar; the soft shadow sets it off from the windows below.
layer_effects "waybar" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
}

# Strength of all blur: passes x radius. Default 2 x 5; a bit softer here.
blur_passes 3
blur_radius 5
