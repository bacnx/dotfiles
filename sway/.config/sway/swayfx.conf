# SwayFX-only settings. Plain sway rejects these commands, so this file is not
# included by default: on a machine running SwayFX add to the untracked
# ~/.config/sway/config.d/local.conf:
#   include ~/.config/sway/swayfx.conf

# Frosted glass behind windows. Blur only shows through the see-through
# parts of a window, so opaque apps look the same; which apps are see-through
# is set per app (alacritty: `opacity` in alacritty.toml; any other app:
# `for_window [app_id="..."] opacity 0.9` in config.d/local.conf).
blur enable

# Frosted glass behind waybar too. waybar's style.css draws one
# semi-transparent full-width bar; the soft shadow sets it off from the
# windows below.
layer_effects "waybar" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
}

# Slightly rounded window corners.
corner_radius 8

# Strength of all blur: passes x radius. Default 2 x 5; a bit softer here.
blur_passes 3
blur_radius 5
