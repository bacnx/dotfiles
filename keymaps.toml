# Every key binding this repo adds, in one place. `dothelp` renders it as the
# cheatsheet page (docs/), so this file is the cheatsheet's only source.
#
# Keep it in step with the configs: a commit that changes a binding in nvim,
# tmux, zsh, sway or lazygit must change this file too. The pre-commit hook
# (.githooks/pre-commit) refuses the commit otherwise, and `dothelp check`
# lists nvim leader maps that are missing here.
#
# Layout: [[group]] is a page section, [[group.card]] a box inside it.
#   id     anchor for the nav link          title  card heading
#   sub    optional line under the heading  rows   the bindings
#
# A row: { keys, desc, mode?, note? }
#   keys   caps separated by spaces, alternatives by " | ". A first cap "L" is
#          the leader (Space); later ones are the L key. C- Ctrl, A- Alt, S- Shift. Shell and :commands are shown as
#          code when they start with ":" or name a command.
#   desc   what it does
#   mode   space-separated modes where it is not normal mode only (n v x o i c,
#          zsh: ins cmd)
#   note   small print under the description

